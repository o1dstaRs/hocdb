name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the core example
        run: zig build -Doptimize=${{ matrix.optimize }}
      - name: Core tests
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
      - name: Every binding regression suite
        run: ./verify_all.sh
        env:
          VERIFY_OPTIMIZE: ${{ matrix.optimize }}
      - name: ReleaseFast core tests
        if: matrix.optimize == 'ReleaseSafe'
        run: zig build test -Doptimize=ReleaseFast --summary all
      - name: Reference, fuzz, durability and cross-binding smoke validation
        if: matrix.optimize == 'ReleaseSafe'
        run: ./scripts/stress/run_overnight.sh --quick
      - name: Benchmarks
        if: matrix.optimize == 'ReleaseSafe'
        run: zig build bench -Doptimize=ReleaseFast
